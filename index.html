<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>육삼수학 도장</title>
<style>
:root{
  --bg:#f6f4ef;
  --panel:#ffffff;
  --ink:#292420;
  --ink-soft:#6b6255;
  --accent:#c23b3b;
  --accent-blue:#2d4f8f;
  --good:#3f9d5c;
  --bad:#d9534f;
  --border:#e4ded2;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,-apple-system,sans-serif;
  line-height:1.5;
}
a{color:inherit;text-decoration:none;}
button,input{font-family:inherit;font-size:1em;}
h1,h2,h3,h4{margin:.3em 0;}
ul{margin:.3em 0;padding-left:1.2em;}
#nav-main{
  position:sticky;top:0;z-index:10;
  background:linear-gradient(135deg,var(--accent-blue),var(--accent));
  color:#fff;
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 18px;flex-wrap:wrap;gap:8px;
  box-shadow:0 2px 8px rgba(0,0,0,.15);
}
#nav-main .brand{font-weight:bold;font-size:1.15em;}
#nav-main nav{display:flex;gap:4px;flex-wrap:wrap;}
#nav-main nav a{
  padding:6px 10px;border-radius:999px;font-size:.88em;
  background:rgba(255,255,255,.12);
}
#nav-main nav a.active,#nav-main nav a:hover{background:rgba(255,255,255,.32);}
#main{max-width:960px;margin:0 auto;padding:18px 16px 60px;}

.hero{text-align:center;padding:22px 10px 6px;}
.hero-badge{font-size:3em;}
.hero p{color:var(--ink-soft);}

.course-nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:16px 0;}
.course-card{
  background:var(--panel);border:2px solid var(--border);border-radius:14px;
  padding:12px;text-align:center;transition:.15s;
}
.course-card:hover{border-color:var(--accent-blue);transform:translateY(-2px);}
.course-card.active{border-color:var(--accent);background:#fdf1ec;}
.course-card.locked{opacity:.5;cursor:not-allowed;}
.course-card.locked:hover{border-color:var(--border);transform:none;}
.course-num{
  width:22px;height:22px;border-radius:50%;background:var(--accent-blue);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:.75em;margin:0 auto 4px;
}
.course-ico{font-size:1.6em;}
.course-label{font-size:.85em;margin-top:2px;}

.intro-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:18px;}
.intro-card{background:var(--panel);border:2px solid var(--border);border-radius:16px;padding:18px;display:block;}
.intro-card:hover{border-color:var(--accent);}
.intro-ico{font-size:2em;}

.progress-outer{background:#eee5d8;border-radius:999px;height:14px;overflow:hidden;margin:6px 0 14px;}
.progress-inner{background:linear-gradient(90deg,var(--accent-blue),var(--accent));height:100%;transition:width .3s;}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;}
.tab{padding:8px 14px;border-radius:999px;background:var(--panel);border:2px solid var(--border);}
.tab.active{border-color:var(--accent-blue);background:#eaf0fa;font-weight:bold;}

.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;}
.chip{
  border:2px solid var(--cc,var(--border));background:var(--panel);border-radius:999px;
  padding:8px 14px;cursor:pointer;font-size:.9em;
}
.chip.selected{background:var(--cc,var(--accent-blue));color:#fff;}
.hint{color:var(--ink-soft);font-size:.92em;}

.compare-table-wrap{overflow-x:auto;margin-top:10px;}
.compare-table{border-collapse:collapse;width:100%;background:var(--panel);}
.compare-table th,.compare-table td{border:1px solid var(--border);padding:10px;vertical-align:top;text-align:left;font-size:.9em;}
.compare-table th{background:#faf7f0;}
.compare-table th[style]{border-top:4px solid var(--cc,var(--accent));}
.row-label{font-weight:bold;white-space:nowrap;background:#faf7f0;}

.scenario-list{display:flex;flex-direction:column;gap:14px;margin-top:10px;}
.scenario-card{background:var(--panel);border:2px solid var(--border);border-radius:16px;padding:16px;}
.scenario-card .next-subunit-link{margin-top:10px;}
.scenario-card.done{border-color:var(--good);}
.scenario-head{display:flex;align-items:center;gap:8px;}
.scenario-ico{font-size:1.4em;}
.stamp-ok{margin-left:auto;color:var(--good);font-weight:bold;font-size:.85em;}
.opt-list{display:flex;flex-direction:column;gap:8px;margin:10px 0;}
.opt-pill{
  border:2px solid var(--border);border-radius:12px;padding:10px 12px;cursor:pointer;font-size:.92em;background:#fff;
}
.opt-pill.picked{border-color:var(--accent-blue);background:#eaf0fa;}
.opt-pill.reveal-correct{border-color:var(--good);background:#e9f7ee;}
.opt-pill.reveal-wrong{border-color:var(--bad);background:#fbeaea;}
label.opt-pill{display:block;}
label.opt-pill input{margin-right:8px;}

button.primary,a.primary{
  background:var(--accent);color:#fff;border:none;border-radius:999px;padding:10px 18px;
  cursor:pointer;font-weight:bold;display:inline-block;
}
button.primary:disabled{opacity:.4;cursor:not-allowed;}
button.ghost,a.ghost{
  background:transparent;color:var(--ink);border:2px solid var(--border);border-radius:999px;
  padding:9px 16px;cursor:pointer;display:inline-block;
}
.result-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}
.feedback{font-size:.92em;color:var(--ink-soft);}

.game-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:14px;}
.game-tile{border-radius:18px;padding:20px;color:#fff;display:block;}
.game-tile h3{margin:.2em 0;}
.game-tile p{font-size:.85em;opacity:.9;}
.game-ico{font-size:2em;}
.g1{background:linear-gradient(135deg,#6a4fa0,#8d6ec9);}
.g3{background:linear-gradient(135deg,#2d4f8f,#4f78c9);}
.g4{background:linear-gradient(135deg,#c23b3b,#e0616a);}

.game-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;color:var(--ink-soft);font-size:.9em;}
.problem{font-size:1.05em;background:var(--panel);border:2px solid var(--border);border-radius:14px;padding:14px;}
.step-list{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px;}
.step{border:2px solid var(--border);border-radius:12px;padding:12px;cursor:pointer;background:var(--panel);}
.step.reveal-correct{border-color:var(--good);background:#e9f7ee;}
.step.reveal-wrong{border-color:var(--bad);background:#fbeaea;}
.explain-box{background:#fff8ea;border:2px solid #f0dfa6;border-radius:12px;padding:12px;margin-top:10px;font-size:.92em;}
.result-score{font-size:1.3em;font-weight:bold;}

.q-diagram{width:140px;height:140px;margin:8px 0;}
.q-diagram svg{width:100%;height:100%;}

.order-slots{display:flex;flex-direction:column;gap:8px;margin:12px 0;}
.order-slot{min-height:44px;border:2px dashed var(--border);border-radius:12px;padding:10px;background:#fff;display:flex;align-items:center;}
.order-slot.slot-correct{border-style:solid;border-color:var(--good);background:#e9f7ee;}
.order-slot.slot-wrong{border-style:solid;border-color:var(--bad);background:#fbeaea;}
.slot-num{color:var(--ink-soft);}
.order-pool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
.order-card{border:2px solid var(--accent-blue);background:#eaf0fa;border-radius:12px;padding:10px 12px;cursor:pointer;}
.order-card:disabled{opacity:.25;cursor:not-allowed;}
.order-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}

.lives{font-size:1.3em;margin-bottom:6px;}
.timerbar-outer{background:#eee5d8;border-radius:999px;height:10px;overflow:hidden;margin-bottom:12px;}
.timerbar{background:var(--accent);height:100%;}
.choice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:12px;}
.choice-btn{border:2px solid var(--border);border-radius:12px;padding:12px;background:#fff;cursor:pointer;font-size:.95em;}
.choice-btn.reveal-correct{border-color:var(--good);background:#e9f7ee;}
.choice-btn.reveal-wrong{border-color:var(--bad);background:#fbeaea;}
.choice-btn:disabled{cursor:default;}

.assess-picker{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:12px;}
.assess-card{background:var(--panel);border:2px solid var(--border);border-radius:16px;padding:16px;display:block;}
.assess-card:hover{border-color:var(--accent-blue);}
.assess-card.locked{opacity:.5;cursor:not-allowed;}
.diff-tag{color:var(--ink-soft);font-size:.82em;font-weight:normal;}
.assess-q{background:var(--panel);border:2px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;}
.fill-input{width:100%;padding:10px;border:2px solid var(--border);border-radius:10px;margin-top:6px;}
.assess-review{margin-top:16px;}
.review-item{border-left:4px solid var(--bad);background:var(--panel);border-radius:8px;padding:10px 12px;margin-bottom:8px;}
.review-item.ok{border-left-color:var(--good);}

.portfolio-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0;}
.stat-card{background:var(--panel);border:2px solid var(--border);border-radius:14px;padding:14px;text-align:center;}
.stat-num{font-size:1.5em;font-weight:bold;color:var(--accent-blue);}
.stat-label{font-size:.82em;color:var(--ink-soft);}
.stamp-row{display:flex;flex-wrap:wrap;gap:8px;}
.stamp{
  width:44px;height:44px;border-radius:50%;border:2px dashed var(--border);
  display:flex;align-items:center;justify-content:center;font-size:1.3em;color:#ccc;
}
.stamp.earned{border-style:solid;border-color:var(--good);background:#e9f7ee;color:inherit;}
.trend-chart{display:flex;align-items:flex-end;gap:8px;height:90px;background:var(--panel);border:2px solid var(--border);border-radius:14px;padding:10px;}
.trend-bar{width:24px;background:linear-gradient(180deg,var(--accent-blue),var(--accent));border-radius:4px 4px 0 0;}
.assess-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;}
.assess-status-card{background:var(--panel);border:2px solid var(--border);border-radius:14px;padding:12px;}
.badge-row{display:flex;flex-wrap:wrap;gap:14px;}
.badge{width:110px;text-align:center;filter:grayscale(1);opacity:.35;}
.badge.earned{filter:none;opacity:1;}
.badge-ico{font-size:2.2em;}
.badge-label{font-size:.8em;}
.cert-cta{margin-top:18px;background:#fff8ea;border:2px solid #f0dfa6;border-radius:16px;padding:16px;text-align:center;}

.cert-frame{border:6px double var(--accent);border-radius:8px;padding:30px;background:#fffdf7;text-align:center;margin-top:16px;}
.cert-inner{max-width:520px;margin:0 auto;}
.cert-eyebrow{letter-spacing:.2em;color:var(--ink-soft);font-size:.85em;}
.cert-title{font-size:2.2em;letter-spacing:.3em;color:var(--accent);}
.cert-body{margin:18px 0;font-size:1.02em;}
.cert-name-row{margin:22px 0;font-size:1.15em;}
.cert-name-row input{border:none;border-bottom:2px solid var(--ink);text-align:center;padding:4px 8px;background:transparent;font-size:1em;}
.cert-date{color:var(--ink-soft);margin-top:8px;}
.cert-seal{margin-top:18px;font-weight:bold;}

#toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);
  background:#22201d;color:#fff;padding:10px 18px;border-radius:999px;font-size:.9em;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:50;
}
#toast.show{opacity:1;transform:translate(-50%,0);}

@media print{
  #nav-main,.course-nav,.no-print{display:none!important;}
  body{background:#fff;}
  #main{padding:0;max-width:none;}
}
</style>
</head>
<body>
<header id="nav-main">
  <div class="brand">🥋 육삼수학 도장</div>
  <nav>
    <a href="#/">🏠 도장 정문</a>
  </nav>
</header>
<main id="main"></main>

<script>
(function(){
'use strict';

function nowISO(){ return new Date().toISOString(); }

/* ===== DATA ===== */
const UNITS = {
  unit1: {
    id:'unit1', title:'분수의 나눗셈', icon:'🥋', unitNumber:1, tagline:'분수 ÷ 분수, 자연수·대분수의 나눗셈을 정복해요.',
    subunits:[
      { id:'fracByFrac', title:'1관 · 분수 ÷ 분수', icon:'🥋', tagline:'분모가 같은/다른 분수끼리 나누는 두 가지 초식을 익혀요.', categories:[
        { id:'sd', label:'분모가 같은 (분수)÷(분수)', icon:'🟰', color:'#b9a98f', sections:[
          { groupId:'concept', label:'원리', icon:'💡', items:[
            {id:'sd-co-1', text:'분모가 같은 분수끼리 나눌 때는 분자끼리 나누면 돼요: (a/c)÷(b/c) = a÷b'},
            {id:'sd-co-2', text:'분모가 같으므로 분모는 계산 결과에 영향을 주지 않고, 분자의 나눗셈만 생각하면 돼요.'}
          ]},
          { groupId:'steps', label:'계산 순서', icon:'👣', items:[
            {id:'sd-st-1', text:'1) 두 분수의 분모가 같은지 확인한다.'},
            {id:'sd-st-2', text:'2) 분자를 분자로 나눈다.'},
            {id:'sd-st-3', text:'3) 나누어떨어지지 않으면 분수(또는 대분수)로 나타낸다.'}
          ]},
          { groupId:'example', label:'실전 예제', icon:'⚔️', items:[
            {id:'sd-ex-1', text:'8/9 ÷ 2/9 = 8÷2 = 4'},
            {id:'sd-ex-2', text:'3/5 ÷ 4/5 = 3÷4 = 3/4'}
          ]},
          { groupId:'caution', label:'주의 급소', icon:'⚠️', items:[
            {id:'sd-ca-1', text:'분모끼리는 나누지 않아요 — 분모가 같다는 사실만 확인하고, 분자끼리 나눠요.'},
            {id:'sd-ca-2', text:'몫이 항상 자연수로 딱 나누어떨어지는 건 아니라는 걸 기억하세요.'}
          ]}
        ]},
        { id:'dd', label:'분모가 다른 (분수)÷(분수)', icon:'🔀', color:'#d9b23c', sections:[
          { groupId:'concept', label:'원리', icon:'💡', items:[
            {id:'dd-co-1', text:'분모가 다르면 먼저 통분해서 분모를 같게 만든 뒤, 분자끼리 나눠요.'},
            {id:'dd-co-2', text:'통분하지 않고 나누는 분수의 역수를 바로 곱해서 계산할 수도 있어요: (a/b)÷(c/d) = (a/b)×(d/c)'}
          ]},
          { groupId:'steps', label:'계산 순서', icon:'👣', items:[
            {id:'dd-st-1', text:'1) 두 분수를 통분한다.'},
            {id:'dd-st-2', text:'2) 분자끼리 나눈다. (또는 나누는 분수의 역수를 바로 곱한다.)'},
            {id:'dd-st-3', text:'3) 나누어떨어지지 않으면 분수로 나타내고 약분한다.'}
          ]},
          { groupId:'example', label:'실전 예제', icon:'⚔️', items:[
            {id:'dd-ex-1', text:'2/3 ÷ 1/4 → 통분: 8/12 ÷ 3/12 = 8÷3 = 8/3 = 2 2/3'},
            {id:'dd-ex-2', text:'3/4 ÷ 2/5 = 3/4 × 5/2 = 15/8 = 1 7/8'}
          ]},
          { groupId:'caution', label:'주의 급소', icon:'⚠️', items:[
            {id:'dd-ca-1', text:'통분할 때 분자도 함께 바뀐다는 것을 잊지 마세요 (분모만 맞추면 안 돼요).'},
            {id:'dd-ca-2', text:'역수는 나누는 분수(÷ 뒤의 분수)만 뒤집어요.'}
          ]}
        ]}
      ]},
      { id:'natMix', title:'2관 · 자연수·대분수의 나눗셈', icon:'🥊', tagline:'자연수와 대분수를 분수로 나누는 역수 곱셈의 원리를 완성해요.', categories:[
        { id:'nat', label:'자연수÷분수', icon:'🔢', color:'#7a4fa0', sections:[
          { groupId:'concept', label:'원리', icon:'💡', items:[
            {id:'nat-co-1', text:'자연수를 분수로 나눌 때는 나누는 분수의 역수를 자연수에 곱해요: 자연수 ÷ (a/b) = 자연수 × (b/a)'}
          ]},
          { groupId:'steps', label:'계산 순서', icon:'👣', items:[
            {id:'nat-st-1', text:'1) 자연수를 분수(자연수/1)로 생각한다.'},
            {id:'nat-st-2', text:'2) 나누는 분수의 역수를 구한다 (분자·분모를 바꾼다).'},
            {id:'nat-st-3', text:'3) 자연수 × 역수로 계산한다.'},
            {id:'nat-st-4', text:'4) 약분하여 기약분수 또는 자연수로 나타낸다.'}
          ]},
          { groupId:'example', label:'실전 예제', icon:'⚔️', items:[
            {id:'nat-ex-1', text:'4 ÷ 2/3 = 4 × 3/2 = 12/2 = 6'},
            {id:'nat-ex-2', text:'6 ÷ 4/5 = 6 × 5/4 = 30/4 = 7 1/2'}
          ]},
          { groupId:'caution', label:'주의 급소', icon:'⚠️', items:[
            {id:'nat-ca-1', text:'역수는 나누는 분수(뒤에 있는 분수)의 것만 구해요. 앞의 자연수는 바뀌지 않아요.'}
          ]}
        ]},
        { id:'mix', label:'대분수÷분수', icon:'🎂', color:'#c23b3b', sections:[
          { groupId:'concept', label:'원리', icon:'💡', items:[
            {id:'mix-co-1', text:'대분수가 있는 나눗셈은 먼저 대분수를 가분수로 바꾼 뒤, 나누는 분수의 역수를 곱해서 계산해요.'},
            {id:'mix-co-2', text:'분모가 같든 다르든, 대분수는 항상 먼저 가분수로 바꾸는 게 첫 단계예요.'}
          ]},
          { groupId:'steps', label:'계산 순서', icon:'👣', items:[
            {id:'mix-st-1', text:'1) 대분수를 가분수로 바꾼다.'},
            {id:'mix-st-2', text:'2) 나누는 분수의 역수를 구한다.'},
            {id:'mix-st-3', text:'3) 가분수 × 역수로 계산한다.'},
            {id:'mix-st-4', text:'4) 약분하고, 필요하면 다시 대분수로 나타낸다.'}
          ]},
          { groupId:'example', label:'실전 예제', icon:'⚔️', items:[
            {id:'mix-ex-1', text:'2 1/4 ÷ 3/7 = 9/4 ÷ 3/7 = 9/4 × 7/3 = 63/12 = 5 1/4'},
            {id:'mix-ex-2', text:'5 1/4 ÷ 1 1/2 = 21/4 ÷ 3/2 = 21/4 × 2/3 = 42/12 = 3 1/2'}
          ]},
          { groupId:'caution', label:'주의 급소', icon:'⚠️', items:[
            {id:'mix-ca-1', text:'대분수를 가분수로 바꾸는 것을 잊으면 완전히 틀린 답이 나와요.'},
            {id:'mix-ca-2', text:'대분수÷대분수인 경우, 두 대분수를 모두 가분수로 바꾼 뒤 계산해요.'}
          ]}
        ]}
      ]}
    ],
    scenarios:[
      { id:'sc-juice1', subunitId:'fracByFrac', categoryId:'sd', icon:'🧃', title:'주스 나누기 대련',

/* ===== STORAGE ===== */
const STORAGE_KEY = 'fractionDojo.state';
function unitStateDefaults(){
  return {
    inputActivities:{},
    compareViews:{ visitedCategoryIds:[] },
    quizHistory:[],
    assessments:{ history:{} }
  };
}
const Storage = {
  defaults(){
    const units = {};
    Object.keys(UNITS).forEach(uid=>{ units[uid] = unitStateDefaults(); });
    return {
      schemaVersion:1, createdAt:nowISO(), updatedAt:nowISO(),
      units:units,
      settings:{ studentName:'' }
    };
  },
  load(){
    let raw = null;
    try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){}
    let parsed = null;
    if(raw){ try{ parsed = JSON.parse(raw); }catch(e){ parsed = null; } }
    const d = this.defaults();
    if(!parsed || typeof parsed !== 'object') return d;
    parsed.schemaVersion = parsed.schemaVersion || 1;
    parsed.units = parsed.units || {};
    Object.keys(UNITS).forEach(uid=>{
      const u = parsed.units[uid] = parsed.units[uid] || {};
      u.inputActivities = u.inputActivities || {};
      u.compareViews = u.compareViews || {};
      u.compareViews.visitedCategoryIds = u.compareViews.visitedCategoryIds || [];
      u.quizHistory = u.quizHistory || [];
      u.assessments = u.assessments || {};
      u.assessments.history = u.assessments.history || {};
    });
    parsed.settings = parsed.settings || { studentName:'' };
    return parsed;
  },
  save(data){
    data.updatedAt = nowISO();
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(e){}
  }
};

/* ===== STATE ===== */
const State = {
  data: Storage.load(),
  save(){ Storage.save(this.data); },
  unit(unitId){ return this.data.units[unitId]; }
};

/* ===== UTIL ===== */
const Util = {
  shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  },
  sample(arr, n){ return this.shuffle(arr).slice(0, n); },
  escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  },
  toast(msg){
    let t = document.getElementById('toast');
    if(!t){ t = document.createElement('div'); t.id='toast'; document.body.appendChild(t); }
    t.textContent = msg;
    t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
    clearTimeout(Util._toastTimer);
    Util._toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
  },
  parseNumber(str){
    if(str==null) return null;
    const s = String(str).trim();
    if(!s) return null;
    let m = s.match(/^(-?\d+)[\s과]+(\d+)\s*\/\s*(\d+)$/);
    if(m){
      const whole=parseInt(m[1],10), num=parseInt(m[2],10), den=parseInt(m[3],10);
      if(!den) return null;
      const sign = whole<0 ? -1 : 1;
      return { num: sign*(Math.abs(whole)*den+num), den };
    }
    m = s.match(/^(-?\d+)\s*\/\s*(\d+)$/);
    if(m){
      const num=parseInt(m[1],10), den=parseInt(m[2],10);
      if(!den) return null;
      return { num, den };
    }
    m = s.match(/^(-?\d+)\.(\d+)$/);
    if(m){
      const sign = m[1].charAt(0)==='-' ? -1 : 1;
      const wholeAbs = Math.abs(parseInt(m[1],10));
      const den = Math.pow(10, m[2].length);
      return { num: sign*(wholeAbs*den+parseInt(m[2],10)), den };
    }
    m = s.match(/^(-?\d+)$/);
    if(m) return { num:parseInt(m[1],10), den:1 };
    return null;
  },
  // 주관식(fill) 채점: q.answer와 q.accept[](허용 답안) 중 하나와 맞으면 정답.
  // 숫자 답은 값으로 비교("5개"처럼 뒤에 붙은 단위는 떼고 비교), 글자 답은 띄어쓰기·문장부호를 무시하고 비교
  answerMatches(user, q){
    const norm = s=>String(s).replace(/[\s.,!?~]/g,'').toLowerCase();
    return [q.answer].concat(q.accept||[]).some(a=>{
      if(this.parseNumber(a)){
        return this.numbersEqual(user, a) || this.numbersEqual(String(user).replace(/\s*[가-힣a-zA-Z㎡]+$/,''), a);
      }
      return norm(user)!=='' && norm(user)===norm(a);
    });
  },
  numbersEqual(a, b){
    const fa = typeof a==='string' ? this.parseNumber(a) : a;
    const fb = typeof b==='string' ? this.parseNumber(b) : b;
    if(!fa || !fb) return false;
    return fa.num*fb.den === fb.num*fa.den;
  },
  // 초식 비교표에 보이는 초식만(hideInCompare 제외). 비교표 칩과 커버리지 %(코스 잠금·급수카드)가 같은 기준을 쓰도록 공유
  compareCategories(unit, su){
    const cats = su ? su.categories : unit.subunits.reduce((acc,s)=>acc.concat(s.categories), []);
    return cats.filter(c=>!c.hideInCompare);
  },
  compareCoverage(unit, visited){
    const cats = this.compareCategories(unit);
    const seen = cats.filter(c=>visited.indexOf(c.id)>=0).length;
    return cats.length ? Math.round(seen/cats.length*100) : 0;
  },
  findCategory(catId){
    for(const uid in UNITS){
      for(const su of UNITS[uid].subunits){
        const c = su.categories.find(c=>c.id===catId);
        if(c) return { unitId:uid, subunit:su, category:c };
      }
    }
    return null;
  },
  shuffleChoices(q){
    if(!q.choices) return q;
    const order = this.shuffle(q.choices.map((c,i)=>i));
    const out = {};
    for(const k in q) out[k] = q[k];
    out.choices = order.map(i=>q.choices[i]);
    out.answerIndex = order.indexOf(q.answerIndex);
    return out;
  },
  saveQuizResult(unitId, mode, score, total){
    const u = State.unit(unitId);
    const pct = total>0 ? Math.round(score/total*100) : 0;
    u.quizHistory.push({ mode, score, total, pct, playedAt: nowISO() });
    if(u.quizHistory.length>30) u.quizHistory.shift();
    State.save();
  },
  cubeStackSVG(heights, opts){
    opts = opts || {};
    const W = opts.size || 32, H = W/2, WALL = opts.wallH || 24;
    const top = opts.topColor || '#eecb96', left = opts.leftColor || '#c99a5b', right = opts.rightColor || '#a97d3f', stroke = opts.stroke || '#6b4a24';
    const rows = heights.length, cols = heights[0].length;
    const cubes = [];
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      const h = heights[r][c]||0;
      for(let k=0;k<h;k++) cubes.push({r,c,k});
    }
    cubes.sort((a,b)=> ((a.r+a.c)-(b.r+b.c)) || (a.k-b.k));
    const centerOf = (r,c,k)=>[ (c-r)*(W/2), (c+r)*(H/2) - k*WALL ];
    let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
    const faces = [];
    cubes.forEach(({r,c,k})=>{
      const [x,y] = centerOf(r,c,k);
      const topPoly = [[x,y-H/2],[x+W/2,y],[x,y+H/2],[x-W/2,y]];
      const leftPoly = [[x-W/2,y],[x,y+H/2],[x,y+H/2+WALL],[x-W/2,y+WALL]];
      const rightPoly = [[x,y+H/2],[x+W/2,y],[x+W/2,y+WALL],[x,y+H/2+WALL]];
      [leftPoly,rightPoly,topPoly].forEach(poly=>poly.forEach(([px,py])=>{
        if(px<minX)minX=px; if(px>maxX)maxX=px; if(py<minY)minY=py; if(py>maxY)maxY=py;
      }));
      faces.push(leftPoly,rightPoly,topPoly);
    });
    const colorOf = i=> i%3===0?left : i%3===1?right : top;
    const pad = 4;
    const vbW = maxX-minX+pad*2, vbH = maxY-minY+pad*2;
    const pt = ([px,py])=>(px-minX+pad)+','+(py-minY+pad);
    const polys = faces.map((poly,i)=>'<polygon points="'+poly.map(pt).join(' ')+'" fill="'+colorOf(i)+'" stroke="'+stroke+'" stroke-width="1" stroke-linejoin="round"/>').join('');
    return '<svg viewBox="0 0 '+vbW+' '+vbH+'" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="쌓기나무 모양">'+polys+'</svg>';
  }
};

/* ===== PROGRESS ===== */
const Progress = {
  stepComplete(unitId, step){
    const unit = UNITS[unitId];
    const u1 = State.unit(unitId);
    if(step===1){
      const done = unit.scenarios.filter(sc=>u1.inputActivities[sc.id] && u1.inputActivities[sc.id].correct).length;
      return done===unit.scenarios.length;
    }
    if(step===2){
      return Util.compareCoverage(unit, u1.compareViews.visitedCategoryIds)>=100;
    }
    if(step===3){
      const bestQuizPct = u1.quizHistory.length ? Math.max.apply(null, u1.quizHistory.map(q=>q.pct)) : 0;
      return bestQuizPct>=80;
    }
    if(step===4){
      return unit.subunits.every(s=>Views.Assessment.tierPassed(u1, s.id, 'advanced'));
    }
    return true;
  },
  stepUnlocked(unitId, step){
    if(step<=1) return true;
    return this.stepComplete(unitId, step-1);
  },
  requireStep(unitId, step){
    if(this.stepUnlocked(unitId, step)) return true;
    const msgs = {
      2:'실전 미션을 모두 완료해야 초식 비교표가 열려요 🔒',
      3:'초식 비교표를 모두 살펴봐야 수련장이 열려요 🔒',
      4:'수련장에서 80% 이상 받아야 승급심사가 열려요 🔒',
      5:'승급심사 심화를 두 관 모두 '+Views.Assessment.PASS_PCT+'% 이상 통과해야 급수 카드가 열려요 🔒'
    };
    Util.toast(msgs[step] || '이전 단계를 먼저 마쳐야 열려요 🔒');
    location.hash = '#/'+unitId;
    return false;
  }
};

/* ===== ROUTER ===== */
window.routeEpoch = 0;
window.activeGameTimer = null;
const Router = {
  routes:[],
  add(pattern, handler){ this.routes.push({pattern, handler}); },
  match(hash){
    const path = (hash||'').replace(/^#/, '') || '/';
    const partsH = path.split('/').filter(Boolean);
    for(const r of this.routes){
      const partsP = r.pattern.split('/').filter(Boolean);
      if(partsP.length !== partsH.length) continue;
      const params = {};
      let ok = true;
      for(let i=0;i<partsP.length;i++){
        if(partsP[i].charAt(0)===':') params[partsP[i].slice(1)] = decodeURIComponent(partsH[i]);
        else if(partsP[i] !== partsH[i]){ ok=false; break; }
      }
      if(ok) return { handler:r.handler, params };
    }
    return null;
  },
  render(){
    window.routeEpoch = (window.routeEpoch||0) + 1;
    if(window.activeGameTimer){ clearInterval(window.activeGameTimer); window.activeGameTimer=null; }
    const main = document.getElementById('main');
    const m = this.match(location.hash);
    if(!m){ location.hash = '#/'; return; }
    m.handler(main, m.params||{});
    highlightNav();
    window.scrollTo(0,0);
  }
};
function highlightNav(){
  const path = (location.hash||'').replace(/^#/, '') || '/';
  document.querySelectorAll('#nav-main nav a').forEach(a=>{
    const href = a.getAttribute('href').replace(/^#/, '') || '/';
    const on = href==='/' ? path==='/' : path.indexOf(href)===0;
    a.classList.toggle('active', on);
  });
}

Views.Input = {
  render(main, params){

    const subunitId = (params && params.subunitId) || unit.subunits[0].id;
    const su = unit.subunits.find(s=>s.id===subunitId) || unit.subunits[0];
    const subIdx = unit.subunits.findIndex(s=>s.id===su.id);
    const nextSubunit = unit.subunits[subIdx+1] || null;
    const u1 = State.unit(unit.id);
    const scenarios = unit.scenarios.filter(sc=>sc.subunitId===su.id);
    const doneCount = scenarios.filter(sc=>u1.inputActivities[sc.id] && u1.inputActivities[sc.id].correct).length;
    const tabs = unit.subunits.map(s=>
      '<a class="tab '+(s.id===su.id?'active':'')+'" href="#/'+unit.id+'/input/'+s.id+'">'+s.icon+' '+s.title+'</a>').join('');
    main.innerHTML =
      UI.courseNav(1, unit.id)+
      '<h2>🥋 실전 미션</h2>'+
      '<div class="tabs">'+tabs+'</div>'+
      '<p class="hint">미션 '+doneCount+'/'+scenarios.length+'개 완료</p>'+
      UI.progressBar(Math.round(doneCount/scenarios.length*100))+
      '<div class="scenario-list">'+scenarios.map((sc,i)=>this.scenarioCard(sc, u1.inputActivities[sc.id], i===scenarios.length-1 ? nextSubunit : null, unit.id)).join('')+'</div>';
    main.querySelectorAll('.opt-pill[data-opt]').forEach(el=>{
      if(el.classList.contains('locked')) return;
      el.addEventListener('click', ()=>el.classList.toggle('picked'));
    });
    main.querySelectorAll('[data-submit]').forEach(btn=>{
      btn.addEventListener('click', ()=>this.submit(btn.getAttribute('data-submit')));
    });
  },
  scenarioCard(sc, record, nextSubunit, unitId){
    const order = record ? record.order : Util.shuffle(sc.options).map(o=>o.id);
    const orderedOptions = order.map(id=>sc.options.find(o=>o.id===id)).filter(Boolean);
    const solved = !!(record && record.correct);
    const picked = solved ? new Set(record.picked) : new Set();
    // 틀린 경우 정답은 공개하지 않고, 지금까지 골랐던 오답만 빨갛게 잠가서 맞힐 때까지 다시 고르게 함
    const tried = new Set(record && !solved ? (record.tried || record.picked) : []);
    const opts = orderedOptions.map(o=>{
      let cls = picked.has(o.id) ? 'picked' : '';
      if(solved){
        cls += o.correct ? ' reveal-correct' : (picked.has(o.id) ? ' reveal-wrong' : '');
        cls += ' locked';
      } else if(tried.has(o.id) && !o.correct){
        cls += ' reveal-wrong locked';
      }
      return '<div class="opt-pill '+cls+'" data-opt="'+o.id+'">'+Util.escapeHtml(o.text)+'</div>';
    }).join('');
    return '<div class="scenario-card '+(solved ? 'done':'')+'" data-sc="'+sc.id+'" data-order=\''+JSON.stringify(order)+'\'>'+
      '<div class="scenario-head"><span class="scenario-ico">'+sc.icon+'</span><h3>'+Util.escapeHtml(sc.title)+'</h3>'+
      (solved ? '<span class="stamp-ok">✅ 완료</span>' : '')+'</div>'+
      '<p>'+Util.escapeHtml(sc.prompt)+'</p>'+
      '<div class="opt-list">'+opts+'</div>'+
      (solved ? '<p class="feedback">🎉 완벽해요! 스탬프를 획득했어요.</p>'
              : (record ? '<p class="feedback">🤔 아직 급소를 못 찾았어요. 빨간 답은 빼고 다시 골라봐요!</p>' : '')+
                '<button class="primary" data-submit="'+sc.id+'">'+(record ? '다시 확인하기' : '확인하기')+'</button>')+
      (nextSubunit ? '<a class="ghost next-subunit-link" href="#/'+unitId+'/input/'+nextSubunit.id+'">다음 단계로 이동 → '+Util.escapeHtml(nextSubunit.title)+'</a>' : '')+
    '</div>';
  },
  submit(scId){
    const card = this._main.querySelector('.scenario-card[data-sc="'+scId+'"]');
    const order = JSON.parse(card.getAttribute('data-order'));
    const picked = [].slice.call(card.querySelectorAll('.opt-pill.picked')).map(el=>el.getAttribute('data-opt'));
    const unit = UNITS[this._params.unitId];
    const sc = unit.scenarios.find(s=>s.id===scId);
    const correctIds = sc.options.filter(o=>o.correct).map(o=>o.id);
    let right=0, wrong=0;
    picked.forEach(id=>{ if(correctIds.indexOf(id)>=0) right++; else wrong++; });
    const score = correctIds.length>0 ? Math.max(0, right-wrong)/correctIds.length : 0;
    const passed = score>=0.6 && picked.length>0;
    const u1 = State.unit(unit.id);
    if(!picked.length){ Util.toast('답을 먼저 골라주세요.'); return; }
    const prev = u1.inputActivities[scId];
    const prevTried = prev && !prev.correct ? (prev.tried || prev.picked || []) : [];
    const tried = prevTried.concat(picked.filter(id=>correctIds.indexOf(id)<0 && prevTried.indexOf(id)<0));
    u1.inputActivities[scId] = { order:order, picked:picked, tried:tried, correct:passed, submittedAt: nowISO() };
    State.save();
    if(passed) Util.toast('✅ 스탬프 획득!');
    else Util.toast('❌ 틀렸어요. 다시 도전해봐요!');
    this.render(this._main, this._params);
  }
};

      '<h2>🔍 초식 교정소</h2>'+
      '<p class="problem">'+Util.escapeHtml(q.problem)+'</p>'+
      '<ol class="step-list">'+
        q.wrongSteps.map((s,i)=>{
          let cls='step';
          if(this.answered){ if(i===q.errorStepIndex) cls+=' reveal-correct'; else if(i===this.pickedIdx) cls+=' reveal-wrong'; }
          return '<li class="'+cls+'" data-i="'+i+'">'+Util.escapeHtml(s)+'</li>';
        }).join('')+
      '</ol>'+
      (this.answered
        ? '<div class="explain-box">'+(this.pickedIdx===q.errorStepIndex?'🎉 정확해요! ':'🤔 아쉬워요. ')+Util.escapeHtml(q.explanation)+'</div>'+
          '<button class="primary" data-next>다음 →</button>'
        : '');
    if(!this.answered){
      main.querySelectorAll('.step').forEach(li=>li.addEventListener('click', ()=>this.answer(parseInt(li.getAttribute('data-i'),10))));
    } else {
      main.querySelector('[data-next]').addEventListener('click', ()=>{
        this.idx++; this.answered=false; this.pickedIdx=null;
        this.render(this._main, this._params);
      });
    }
  },
  answer(i){
    const q = this.items[this.idx];
    this.answered = true; this.pickedIdx = i;
    if(i===q.errorStepIndex) this.score++;
    this.render(this._main, this._params);
  },
  renderResult(){
    const unit = UNITS[this._params.unitId];
    this._main.innerHTML =
      UI.courseNav(3, unit.id)+
      '<h2>🔍 초식 교정소 결과</h2>'+
      '<p class="result-score">'+this.score+' / '+this.items.length+' 정답!</p>'+
      '<div class="result-actions">'+
        '<button class="primary" data-retry>다시 도전</button>'+
        '<a class="ghost" href="#/'+unit.id+'/quiz">수련장으로</a>'+
      '</div>';
    this._main.querySelector('[data-retry]').addEventListener('click', ()=>{ this.start(); this.render(this._main, this._params); });
  }
};

Views.OrderGame = {
  start(){
    this._epoch = window.routeEpoch;
    const unit = UNITS[this._params.unitId];
    this.recipe = Util.sample(unit.procedureRecipes, 1)[0];
    this.pool = Util.shuffle(this.recipe.steps);
    this.placed = this.recipe.steps.map(()=>null);
    this.checked = false; this.correctCount = 0; this.finished=false;
  },
  render(main, params){
    this._main = main; this._params = params;
    const unit = UNITS[params.unitId];
    if(!unit){ Util.toast('알 수 없는 단원이에요.'); location.hash = '#/'; return; }
    if(!Progress.requireStep(unit.id, 3)) return;
    if(this._epoch !== window.routeEpoch) this.start();
    const n = this.recipe.steps.length;
    main.innerHTML =
      UI.courseNav(3, unit.id)+
      '<div class="game-header"><a href="#/'+unit.id+'/quiz">← 수련장</a></div>'+
      '<h2>🧭 품새 순서 맞추기</h2>'+
      '<h3>'+Util.escapeHtml(this.recipe.title)+'</h3>'+
      '<p class="hint">아래 카드를 순서대로 클릭해 올바른 계산 순서를 완성해보세요.</p>'+
      '<div class="order-slots">'+
        this.placed.map((p,i)=>{
          let cls='order-slot';
          if(this.checked) cls += (p===this.recipe.steps[i] ? ' slot-correct' : ' slot-wrong');
          return '<div class="'+cls+'">'+(p ? '<span>'+(i+1)+'. '+Util.escapeHtml(p)+'</span>' : '<span class="slot-num">'+(i+1)+'번</span>')+'</div>';
        }).join('')+
      '</div>'+
      '<div class="order-pool">'+
        this.pool.map((s,i)=>'<button class="order-card" data-i="'+i+'" '+(this.placed.indexOf(s)>=0?'disabled':'')+'>'+Util.escapeHtml(s)+'</button>').join('')+
      '</div>'+
      '<div class="order-actions">'+
        '<button class="ghost" data-reshuffle>🔄 다시 섞기</button>'+
        (this.checked
          ? '<span class="result-score">'+this.correctCount+'/'+n+' 정답!</span>'
          : '<button class="primary" data-check '+(this.placed.some(p=>!p)?'disabled':'')+'>확인하기</button>')+
      '</div>';
    main.querySelectorAll('.order-card:not([disabled])').forEach(btn=>btn.addEventListener('click', ()=>this.place(parseInt(btn.getAttribute('data-i'),10))));
    main.querySelector('[data-reshuffle]').addEventListener('click', ()=>{ this.start(); this.render(this._main, this._params); });
    const cb = main.querySelector('[data-check]');
    if(cb) cb.addEventListener('click', ()=>this.check());
  },
  place(poolIdx){
    if(this.checked) return;
    const step = this.pool[poolIdx];
    const nextEmpty = this.placed.indexOf(null);
    if(nextEmpty===-1) return;
    this.placed[nextEmpty] = step;
    this.render(this._main, this._params);
  },
  check(){
    this.checked = true;
    this.correctCount = this.placed.filter((p,i)=>p===this.recipe.steps[i]).length;
    if(!this.finished){ this.finished=true; Util.saveQuizResult(this._params.unitId, 'order', this.correctCount, this.recipe.steps.length); }
    this.render(this._main, this._params);
  }
};

Views.Speed = {
  start(){
    this._epoch = window.routeEpoch;
    const unit = UNITS[this._params.unitId];
    this.items = Util.sample(unit.quiz.pool, Math.min(12, unit.quiz.pool.length)).map(q=>Util.shuffleChoices(q));
    this.idx=0; this.score=0; this.lives=3; this.finished=false;
    this.startQuestion();
  },
  startQuestion(){
    this.timeLeft = 15; this.answered=false; this.pickedIdx=null;
    const myEpoch = this._epoch;
    if(window.activeGameTimer) clearInterval(window.activeGameTimer);
    window.activeGameTimer = setInterval(()=>{
      if(myEpoch !== window.routeEpoch){ clearInterval(window.activeGameTimer); return; }
      this.timeLeft -= 0.1;
      if(this.timeLeft<=0 && !this.answered){ this.answer(-1); return; }
      this.updateTimerBar();
    }, 100);
  },
  updateTimerBar(){
    if(!this._main) return;
    const bar = this._main.querySelector('.timerbar');
    if(bar) bar.style.width = Math.max(0, this.timeLeft/15*100)+'%';
  },
  render(main, params){
    this._main = main; this._params = params;
    const unit = UNITS[params.unitId];
    if(!unit){ Util.toast('알 수 없는 단원이에요.'); location.hash = '#/'; return; }
    if(!Progress.requireStep(unit.id, 3)) return;
    if(this._epoch !== window.routeEpoch) this.start();
    if(this.lives<=0 || this.idx>=this.items.length){
      if(!this.finished){
        this.finished = true;
        if(window.activeGameTimer){ clearInterval(window.activeGameTimer); window.activeGameTimer=null; }
        Util.saveQuizResult(unit.id, 'speed', this.score, this.items.length);
      }
      this.renderResult();
      return;
    }
    const q = this.items[this.idx];
    const pct = Math.max(0, this.timeLeft/15*100);
    main.innerHTML =
      UI.courseNav(3, unit.id)+
      '<div class="game-header"><a href="#/'+unit.id+'/quiz">← 수련장</a><span>'+(this.idx+1)+' / '+this.items.length+'</span></div>'+
      '<h2>⚡ 스피드 격파</h2>'+
      '<div class="lives">'+'❤️'.repeat(Math.max(0,this.lives))+'🖤'.repeat(Math.max(0,3-this.lives))+'</div>'+
      '<div class="timerbar-outer"><div class="timerbar" style="width:'+pct+'%"></div></div>'+
      (q.diagram ? '<div class="q-diagram">'+Util.cubeStackSVG(q.diagram)+'</div>' : '')+
      '<p class="problem">'+Util.escapeHtml(q.prompt)+'</p>'+
      '<div class="choice-grid">'+
        q.choices.map((c,i)=>{
          let cls='choice-btn';
          if(this.answered){ if(i===q.answerIndex) cls+=' reveal-correct'; else if(i===this.pickedIdx) cls+=' reveal-wrong'; }
          return '<button class="'+cls+'" data-i="'+i+'" '+(this.answered?'disabled':'')+'>'+Util.escapeHtml(c)+'</button>';
        }).join('')+
      '</div>'+
      (this.answered ? '<div class="explain-box">'+Util.escapeHtml(q.explanation||'')+'</div>' : '');
    if(!this.answered){
      main.querySelectorAll('.choice-btn').forEach(btn=>btn.addEventListener('click', ()=>this.answer(parseInt(btn.getAttribute('data-i'),10))));
    }
  },
  answer(i){
    if(this._epoch !== window.routeEpoch || this.answered) return;
    this.answered = true; this.pickedIdx = i;
    const q = this.items[this.idx];
    if(i===q.answerIndex) this.score++; else this.lives--;
    if(window.activeGameTimer){ clearInterval(window.activeGameTimer); window.activeGameTimer=null; }
    this.render(this._main, this._params);
    const myEpoch = this._epoch;
    setTimeout(()=>{
      if(myEpoch !== window.routeEpoch) return;
      this.idx++;
      if(this.lives>0 && this.idx<this.items.length) this.startQuestion();
      this.render(this._main, this._params);
    }, 1200);
  },
  renderResult(){
    const unit = UNITS[this._params.unitId];
    this._main.innerHTML =
      UI.courseNav(3, unit.id)+
      '<h2>⚡ 스피드 격파 결과</h2>'+
      '<p class="result-score">'+this.score+' / '+this.items.length+' 정답! 남은 목숨: '+'❤️'.repeat(Math.max(0,this.lives))+'</p>'+
      '<div class="result-actions">'+
        '<button class="primary" data-retry>다시 도전</button>'+
        '<a class="ghost" href="#/'+unit.id+'/quiz">수련장으로</a>'+
      '</div>';
    this._main.querySelector('[data-retry]').addEventListener('click', ()=>{ this.start(); this.render(this._main, this._params); });
  }
};

Views.Assessment = {
  TIERS:[
    {id:'basic', label:'기본', icon:'🥉'},
    {id:'extra', label:'보충', icon:'🥈'},
    {id:'advanced', label:'심화', icon:'🥇'}
  ],
  PASS_PCT:80,
  scoreLabel(pct){
    if(pct>=85) return '🌟 우수';
    if(pct>=this.PASS_PCT) return '✅ 통과';
    return '🔄 재도전 필요';
  },
  tierHistory(u1, subunitId, tier){
    const h = u1.assessments.history[subunitId];
    return (h && h[tier]) || [];
  },
  tierPassed(u1, subunitId, tier){
    const hist = this.tierHistory(u1, subunitId, tier);
    const last = hist[hist.length-1];
    return !!(last && last.scorePercent>=this.PASS_PCT);
  },
  // 다음 단계 응시 자격: 이 단계에서 한 번이라도 PASS_PCT 이상을 받았는지(이후 재응시 점수가 낮아도 다시 잠기지 않음)
  tierEverPassed(u1, subunitId, tier){
    return this.tierHistory(u1, subunitId, tier).some(h=>h.scorePercent>=this.PASS_PCT);
  },
  tierUnlocked(u1, subunitId, tier){
    if(tier==='basic') return true;
    if(tier==='extra') return this.tierEverPassed(u1, subunitId, 'basic');
    if(tier==='advanced') return this.tierEverPassed(u1, subunitId, 'extra');
    return false;
  },
  beltInfo(u1, subunitId){
    const basicPass = this.tierPassed(u1, subunitId, 'basic');
    const extraPass = this.tierPassed(u1, subunitId, 'extra');
    const advHist = this.tierHistory(u1, subunitId, 'advanced');
    const advLast = advHist[advHist.length-1];
    if(advLast && advLast.scorePercent>=85) return {label:'⚫ 검은띠 유단자', step:4};
    if(advLast && advLast.scorePercent>=this.PASS_PCT) return {label:'🔴 빨간띠', step:3};
    if(basicPass && extraPass) return {label:'🔵 파란띠', step:2};
    if(basicPass || extraPass) return {label:'🟡 노란띠', step:1};
    return {label:'🤍 흰띠 후보생', step:0};
  },
  startSubunitTier(unitId, subunitId, tier){
    this._epoch = window.routeEpoch;
    this._activeUnit = unitId;
    this._activeSubunit = subunitId;
    this._activeTier = tier;
    const pool = UNITS[unitId].assessment.pool.filter(q=>q.subunitId===subunitId && q.tier===tier);
    this.items = Util.sample(pool, pool.length).map(q=>Util.shuffleChoices(q));
    this.submitted = false; this.result = null;
  },
  render(main, params){
    this._main = main; this._params = params;
    const unit = params && UNITS[params.unitId];
    if(!unit){ Util.toast('알 수 없는 단원이에요.'); location.hash = '#/'; return; }
    if(!Progress.requireStep(unit.id, 4)) return;
    if(!params.subunitId){ this.renderPicker(unit); return; }
    if(!params.tier){ this.renderTierPicker(unit, params.subunitId); return; }
    const subunitId = params.subunitId, tier = params.tier;
    if(this._epoch !== window.routeEpoch || this._activeUnit !== unit.id || this._activeSubunit !== subunitId || this._activeTier !== tier){
      const u1 = State.unit(unit.id);
      const locked = !this.tierUnlocked(u1, subunitId, tier);
      if(locked){
        const msg = tier==='extra' ? '보충은 기본에서 '+this.PASS_PCT+'% 이상 받아야 열려요 🔒' : '심화는 보충에서 '+this.PASS_PCT+'% 이상 받아야 열려요 🔒';
        Util.toast(msg);
        location.hash = '#/'+unit.id+'/assessment/'+subunitId;
        return;
      }
      this.startSubunitTier(unit.id, subunitId, tier);
    }
    if(this.submitted) this.renderResult(unit, subunitId, tier);
    else this.renderForm(unit, subunitId, tier);
  },
  renderPicker(unit){
    const u1 = State.unit(unit.id);
    this._main.innerHTML =
      UI.courseNav(4, unit.id)+
      '<h2>📝 승급심사</h2>'+
      '<p class="hint">각 관마다 기본 → 보충 → 심화 3단계 승급심사가 있어요. 심화를 통과하면 검은띠 유단자!</p>'+
      '<div class="assess-picker">'+
        unit.subunits.map(s=>{
          const belt = this.beltInfo(u1, s.id);
          return '<a class="assess-card" href="#/'+unit.id+'/assessment/'+s.id+'">'+
            '<h3>'+s.icon+' '+Util.escapeHtml(s.title)+'</h3>'+
            '<p>'+belt.label+'</p>'+
          '</a>';
        }).join('')+
      '</div>';
  },
  renderTierPicker(unit, subunitId){
    const u1 = State.unit(unit.id);
    const su = unit.subunits.find(s=>s.id===subunitId);
    const lockedHints = {extra:'기본에서 '+this.PASS_PCT+'% 이상 받으면 열려요', advanced:'보충에서 '+this.PASS_PCT+'% 이상 받으면 열려요'};
    this._main.innerHTML =
      UI.courseNav(4, unit.id)+
      '<h2>📝 '+Util.escapeHtml(su.title)+' 승급심사</h2>'+
      '<p class="hint">'+this.beltInfo(u1, subunitId).label+'</p>'+
      '<div class="assess-picker">'+
        this.TIERS.map(t=>{
          const hist = this.tierHistory(u1, subunitId, t.id);
          const last = hist[hist.length-1];
          const locked = !this.tierUnlocked(u1, subunitId, t.id);
          const inner = '<h3>'+t.icon+' '+t.label+' '+(locked?'🔒':'')+'</h3>'+
            (last ? '<p>최근 '+last.scorePercent+'% · '+this.scoreLabel(last.scorePercent)+'</p>' : '<p class="hint">'+(locked?lockedHints[t.id]:'아직 응시하지 않았어요')+'</p>');
          return locked
            ? '<div class="assess-card locked">'+inner+'</div>'
            : '<a class="assess-card" href="#/'+unit.id+'/assessment/'+subunitId+'/'+t.id+'">'+inner+'</a>';
        }).join('')+
      '</div>';
  },
  renderForm(unit, subunitId, tier){
    const su = unit.subunits.find(s=>s.id===subunitId);
    const tierDef = this.TIERS.find(t=>t.id===tier);
    const fillPlaceholder = unit.id==='unit2' ? '예: 6.4' : unit.id==='unit3' ? '' : '예: 3/4 또는 1 1/2';
    this._main.innerHTML =
      UI.courseNav(4, unit.id)+
      '<h2>📝 '+Util.escapeHtml(su.title)+' · '+tierDef.icon+' '+tierDef.label+'</h2>'+
      '<form id="assess-form">'+
        this.items.map((q,i)=>
          '<div class="assess-q"><p><b>'+(i+1)+'.</b> <span class="diff-tag">['+Util.escapeHtml(q.difficulty||'')+']</span> '+Util.escapeHtml(q.prompt)+'</p>'+
          (q.diagram ? '<div class="q-diagram">'+Util.cubeStackSVG(q.diagram)+'</div>' : '')+
          (q.type==='mcq'
            ? '<div class="opt-list">'+q.choices.map((c,ci)=>'<label class="opt-pill"><input type="radio" name="'+q.id+'" value="'+ci+'"> '+Util.escapeHtml(c)+'</label>').join('')+'</div>'
            : '<input type="text" name="'+q.id+'" class="fill-input" placeholder="'+fillPlaceholder+'">')+
          '</div>').join('')+
        '<button type="submit" class="primary">제출하기</button>'+
      '</form>';
    this._main.querySelector('#assess-form').addEventListener('submit', (e)=>{ e.preventDefault(); this.submit(unit, subunitId, tier); });
  },
  submit(unit, subunitId, tier){
    const form = this._main.querySelector('#assess-form');
    const fd = new FormData(form);
    let correct = 0;
    const detail = this.items.map(q=>{
      let userAnswer, isCorrect;
      if(q.type==='mcq'){
        const v = fd.get(q.id);
        userAnswer = v===null ? null : q.choices[parseInt(v,10)];
        isCorrect = v!==null && parseInt(v,10)===q.answerIndex;
      } else {
        userAnswer = (fd.get(q.id)||'').trim();
        isCorrect = Util.answerMatches(userAnswer, q);
      }
      if(isCorrect) correct++;
      return { q:q, userAnswer:userAnswer, isCorrect:isCorrect };
    });
    const scorePercent = Math.round(correct/this.items.length*100);
    const u1 = State.unit(unit.id);
    u1.assessments.history[subunitId] = u1.assessments.history[subunitId] || {basic:[], extra:[], advanced:[]};
    const hist = u1.assessments.history[subunitId][tier] = u1.assessments.history[subunitId][tier] || [];
    const prevLast = hist.length ? hist[hist.length-1] : null;
    hist.push({ date: nowISO(), scorePercent:scorePercent, correct:correct, total:this.items.length });
    if(hist.length>5) hist.shift();
    State.save();
    this.submitted = true;
    this.result = { detail:detail, scorePercent:scorePercent, prevPercent: prevLast ? prevLast.scorePercent : null };
    if(tier==='advanced' && scorePercent>=this.PASS_PCT){
      const other = unit.subunits.find(s=>s.id!==subunitId);
      if(other && this.tierPassed(u1, other.id, 'advanced')) Util.toast('🎉 두 관의 심화를 모두 통과했어요! 단증을 받을 수 있어요.');
    }
    this.render(this._main, this._params);
  },
  // 이 관의 심화는 통과했지만 아직 심화를 통과하지 못한 관이 남았을 때: 남은 관 이름과 바로 가기 버튼
  remainingAdvancedNotice(unit){
    const u1 = State.unit(unit.id);
    const left = unit.subunits.filter(s=>!this.tierPassed(u1, s.id, 'advanced'));
    if(!left.length) return '';
    return '<div class="explain-box"><p>🔒 <b>급수 카드</b>는 두 관의 심화를 모두 '+this.PASS_PCT+'% 이상 통과해야 열려요. 남은 관: <b>'+
        left.map(s=>Util.escapeHtml(s.title)).join(', ')+'</b></p>'+
      left.map(s=>{
        const target = this.tierUnlocked(u1, s.id, 'advanced') ? '/advanced' : '';
        return '<a class="primary" href="#/'+unit.id+'/assessment/'+s.id+target+'">'+s.icon+' '+Util.escapeHtml(s.title)+' 승급심사 하러 가기 →</a>';
      }).join(' ')+
    '</div>';
  },
  renderResult(unit, subunitId, tier){
    const su = unit.subunits.find(s=>s.id===subunitId);
    const tierDef = this.TIERS.find(t=>t.id===tier);
    const r = this.result;
    const passedNow = r.scorePercent>=this.PASS_PCT;
    const portfolioOpen = tier==='advanced' && passedNow && Progress.stepUnlocked(unit.id, 5);
    let growthMsg = '';
    if(r.prevPercent!=null){
      if(r.scorePercent > r.prevPercent) growthMsg = '📈 지난번('+r.prevPercent+'%)보다 올랐어요!';
      else if(r.scorePercent < r.prevPercent) growthMsg = '지난번('+r.prevPercent+'%)보다 아쉬워요. 다시 도전해 볼까요?';
      else growthMsg = '지난번과 같은 점수예요.';
    }
    this._main.innerHTML =
      UI.courseNav(4, unit.id)+
      '<h2>📝 '+Util.escapeHtml(su.title)+' · '+tierDef.icon+' '+tierDef.label+' 결과</h2>'+
      '<p class="result-score">'+r.scorePercent+'% · '+this.scoreLabel(r.scorePercent)+'</p>'+
      '<p class="hint">'+growthMsg+'</p>'+
      '<div class="assess-review">'+
        r.detail.map((d,i)=>
          '<div class="review-item '+(d.isCorrect?'ok':'no')+'">'+
            '<p><b>'+(i+1)+'.</b> '+Util.escapeHtml(d.q.prompt)+'</p>'+
            '<p>내 답: '+Util.escapeHtml(d.userAnswer || '(무응답)')+' '+(d.isCorrect?'✅':'❌')+'</p>'+
            (!d.isCorrect && d.q.type==='fill' ? '<p><b>정답: '+Util.escapeHtml(d.q.answer)+'</b></p>' : '')+
            (!d.isCorrect ? '<p class="explain-box">'+Util.escapeHtml(d.q.explanation||'')+'</p>' : '')+
          '</div>').join('')+
      '</div>'+
      '<div class="result-actions">'+
        '<button class="primary" data-retry>다시 응시</button>'+
        // 이번 점수가 PASS_PCT 이상일 때만 다음 단계로 나가는 버튼을 보여줌, 급수 카드는 심화 통과로 5단계가 열렸을 때만
        (passedNow ? '<a class="ghost" href="#/'+unit.id+'/assessment/'+subunitId+'">다른 단계 선택</a>' : '')+
        (portfolioOpen ? '<a class="ghost" href="#/'+unit.id+'/portfolio">급수 카드로</a>' : '')+
      '</div>'+
      (!passedNow ? '<p class="hint">'+this.PASS_PCT+'% 이상 받아야 다음 단계로 갈 수 있어요. 다시 도전해봐요! 💪</p>'
        : (tier==='advanced' && !portfolioOpen ? this.remainingAdvancedNotice(unit) : ''));
    this._main.querySelector('[data-retry]').addEventListener('click', ()=>{
      this.startSubunitTier(unit.id, subunitId, tier);
      this.render(this._main, this._params);
    });
  }
};

Views.Portfolio = {
  render(main, params){
    const unit = params && UNITS[params.unitId];
    if(!unit){ Util.toast('알 수 없는 단원이에요.'); location.hash = '#/'; return; }
    if(!Progress.requireStep(unit.id, 5)) return;
    const u1 = State.unit(unit.id);
    const scenarios = unit.scenarios;
    const stampsDone = scenarios.filter(sc=>u1.inputActivities[sc.id] && u1.inputActivities[sc.id].correct);
    const compareCoverage = Util.compareCoverage(unit, u1.compareViews.visitedCategoryIds);
    const quizHistory = u1.quizHistory;
    const quizPlays = quizHistory.length;
    const bestQuizPct = quizHistory.length ? Math.max.apply(null, quizHistory.map(q=>q.pct)) : 0;
    const recent6 = quizHistory.slice(-6);
    const subs = unit.subunits;
    const bothPassed = subs.every(s=>Views.Assessment.tierPassed(u1, s.id, 'advanced'));

    const badgeDefs = [
      {ico:'🥋', label:'미션 완료', earned: stampsDone.length===scenarios.length},
      {ico:'📊', label:'초식 전체 마스터', earned: compareCoverage>=100},
      {ico:'🥊', label:'수련왕', earned: bestQuizPct>=80},
      {ico:'🥇', label:'유단자 인증', earned: bothPassed}
    ];

    main.innerHTML =
      UI.courseNav(5, unit.id)+
      '<h2>🎽 급수 카드</h2>'+
      '<section class="portfolio-stats">'+
        '<div class="stat-card"><div class="stat-num">'+stampsDone.length+'/'+scenarios.length+'</div><div class="stat-label">미션 스탬프</div></div>'+
        '<div class="stat-card"><div class="stat-num">'+compareCoverage+'%</div><div class="stat-label">초식 비교 커버리지</div></div>'+
        '<div class="stat-card"><div class="stat-num">'+quizPlays+'</div><div class="stat-label">수련 횟수</div></div>'+
        '<div class="stat-card"><div class="stat-num">'+bestQuizPct+'%</div><div class="stat-label">최고 수련 점수</div></div>'+
      '</section>'+
      '<section class="stamp-book"><h3>수련 스탬프</h3><div class="stamp-row">'+
        scenarios.map(sc=>{
          const done = u1.inputActivities[sc.id] && u1.inputActivities[sc.id].correct;
          return '<div class="stamp '+(done?'earned':'')+'">'+(done?sc.icon:'⚪')+'</div>';
        }).join('')+
      '</div></section>'+
      '<section class="quiz-trend"><h3>수련 점수 추이</h3><div class="trend-chart">'+
        (recent6.length
          ? recent6.map(q=>'<div class="trend-bar" style="height:'+Math.max(6,q.pct)+'%" title="'+q.mode+' '+q.pct+'%"></div>').join('')
          : '<p class="hint">아직 수련 기록이 없어요.</p>')+
      '</div></section>'+
      '<section class="assess-status"><h3>승급심사 현황</h3><div class="assess-grid">'+
        subs.map(s=>{
          const belt = Views.Assessment.beltInfo(u1, s.id);
          const tierRow = Views.Assessment.TIERS.map(t=>{
            const hist = Views.Assessment.tierHistory(u1, s.id, t.id);
            const last = hist[hist.length-1];
            const locked = !Views.Assessment.tierUnlocked(u1, s.id, t.id);
            const state = last ? (last.scorePercent>=Views.Assessment.PASS_PCT?'✅':'❌') : (locked?'🔒':'⬜');
            return t.label+' '+state;
          }).join(' · ');
          return '<div class="assess-status-card"><h4>'+s.icon+' '+Util.escapeHtml(s.title)+'</h4>'+
            '<p>'+belt.label+'</p><p class="hint">'+tierRow+'</p></div>';
        }).join('')+
      '</div></section>'+
      '<section class="badge-wall"><h3>휘장 모음</h3><div class="badge-row">'+
        badgeDefs.map(b=>'<div class="badge '+(b.earned?'earned':'')+'"><div class="badge-ico">'+b.ico+'</div><div class="badge-label">'+b.label+'</div></div>').join('')+
      '</div></section>'+
      '<section class="cert-cta">'+
        (bothPassed
          ? '<p>🎉 축하해요! 두 관 모두 심화를 '+Views.Assessment.PASS_PCT+'% 이상 통과해서 단증을 받을 수 있어요.</p><a class="primary" href="#/'+unit.id+'/certificate">🥋 단증 받으러 가기 →</a>'
          : '<p class="hint">두 관 승급심사 심화에서 각각 '+Views.Assessment.PASS_PCT+'% 이상을 받으면 단증을 받을 수 있어요.</p>')+
      '</section>';
  }
};

Views.Certificate = {
  render(main, params){
    const unit = params && UNITS[params.unitId];
    if(!unit){ Util.toast('알 수 없는 단원이에요.'); location.hash = '#/'; return; }
    const u1 = State.unit(unit.id);
    const subs = unit.subunits;
    const bothPassed = subs.every(s=>Views.Assessment.tierPassed(u1, s.id, 'advanced'));
    if(!bothPassed){
      const missing = subs.filter(s=>!Views.Assessment.tierPassed(u1, s.id, 'advanced')).map(s=>s.title);
      Util.toast('아직 단증을 받을 수 없어요! '+missing.join(', ')+'의 심화 승급심사를 먼저 통과해봐요 💪');
      location.hash = '#/'+unit.id+'/portfolio';
      return;
    }
    const bothMaster = subs.every(s=>{
      const hist = Views.Assessment.tierHistory(u1, s.id, 'advanced');
      const last = hist[hist.length-1];
      return last && last.scorePercent>=85;
    });
    const finalBelt = bothMaster ? '검은띠 유단자' : '빨간띠';
    const name = State.data.settings.studentName || '';
    main.innerHTML =
      '<div class="cert-frame"><div class="cert-inner">'+
        '<p class="cert-eyebrow">육삼수학 도장</p>'+
        '<h1 class="cert-title">단 증</h1>'+
        '<p class="cert-body">위 수련생은 6학년 2학기 '+(unit.unitNumber||'')+'단원 「'+Util.escapeHtml(unit.title)+'」의 모든 승급심사를 통과하여<br>이에 '+finalBelt+' 단증을 수여합니다.</p>'+
        '<div class="cert-name-row"><label>수련생 이름: </label><input id="cert-name" type="text" value="'+Util.escapeHtml(name)+'" placeholder="이름을 입력하세요"></div>'+
        '<div class="cert-date">'+new Date().toLocaleDateString('ko-KR')+'</div>'+
        '<div class="cert-seal">육삼수학 도장 관장 🥋</div>'+
      '</div></div>'+
      '<div class="no-print result-actions">'+
        '<button class="primary" id="cert-save">이름 저장</button>'+
        '<button class="ghost" id="cert-print">🖨️ 인쇄하기</button>'+
        '<a class="ghost" href="#/'+unit.id+'/portfolio">급수 카드로</a>'+
      '</div>';
    main.querySelector('#cert-save').addEventListener('click', ()=>this.saveName());
    main.querySelector('#cert-print').addEventListener('click', ()=>window.print());
  },
  saveName(){
    const input = document.getElementById('cert-name');
    State.data.settings.studentName = input.value.trim();
    State.save();
    Util.toast('✅ 이름이 저장됐어요!');
  }
};

/* ===== DEBUG SELF-CHECK ===== */
function debugSelfCheck(){
  const errors = [];
  Object.keys(UNITS).forEach(unitId=>{
    const unit = UNITS[unitId];
    const allCatIds = {};
    unit.subunits.forEach(su=>su.categories.forEach(c=>{ allCatIds[c.id]=true; }));
    const subIds = {};
    unit.subunits.forEach(s=>{ subIds[s.id]=true; });

    unit.scenarios.forEach(sc=>{
      if(!allCatIds[sc.categoryId]) errors.push(unitId+' scenario '+sc.id+': unknown categoryId '+sc.categoryId);
      if(!subIds[sc.subunitId]) errors.push(unitId+' scenario '+sc.id+': unknown subunitId '+sc.subunitId);
      const ids = sc.options.map(o=>o.id);
      if(new Set(ids).size !== ids.length) errors.push(unitId+' scenario '+sc.id+': duplicate option ids');
      if(!sc.options.some(o=>o.correct)) errors.push(unitId+' scenario '+sc.id+': no correct option');
    });
    unit.quiz.pool.forEach(q=>{
      if(!allCatIds[q.categoryId]) errors.push(unitId+' quiz '+q.id+': unknown categoryId '+q.categoryId);
      if(q.answerIndex<0 || q.answerIndex>=q.choices.length) errors.push(unitId+' quiz '+q.id+': bad answerIndex');
    });
    unit.detectivePool.forEach(d=>{
      if(!allCatIds[d.categoryId]) errors.push(unitId+' detective '+d.id+': unknown categoryId');
      if(d.errorStepIndex<0 || d.errorStepIndex>=d.wrongSteps.length) errors.push(unitId+' detective '+d.id+': bad errorStepIndex');
    });
    unit.procedureRecipes.forEach(r=>{
      if(!allCatIds[r.categoryId]) errors.push(unitId+' recipe '+r.id+': unknown categoryId');
      if(!r.steps || r.steps.length<2) errors.push(unitId+' recipe '+r.id+': too few steps');
    });
    const validTiers = {basic:true, extra:true, advanced:true};
    const tierCounts = {};
    unit.assessment.pool.forEach(q=>{
      if(!subIds[q.subunitId]) errors.push(unitId+' assessment '+q.id+': unknown subunitId');
      if(!validTiers[q.tier]) errors.push(unitId+' assessment '+q.id+': unknown tier '+q.tier);
      if(q.type==='mcq' && (q.answerIndex<0 || q.answerIndex>=q.choices.length)) errors.push(unitId+' assessment '+q.id+': bad answerIndex');
      if(q.type==='fill' && !q.answer) errors.push(unitId+' assessment '+q.id+': missing answer');
      const key = q.subunitId+'/'+q.tier;
      tierCounts[key] = (tierCounts[key]||0) + 1;
    });
    unit.subunits.forEach(s=>{
      Object.keys(validTiers).forEach(t=>{
        const key = s.id+'/'+t;
        if(!tierCounts[key]) errors.push(unitId+' assessment: no items for '+key);
      });
    });
  });

  if(errors.length){ console.error('DATA CHECK FAILED', errors); }
  else console.log('DATA CHECK OK');
}
